  <style>
/* Froggy Fortunes page and HTML splash (Bright Star style: themed gradient, logo, time-matched progress bar):
   the painted pond, blurred and darkened, behind the logo and drifting fireflies. */
html, body { margin: 0; height: 100%; background: #0f2a1c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#game canvas { display: block; }
#splash {
  --font: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5vh;
  background: linear-gradient(180deg, #8fdcf0 0%, #bfeee0 30%, #5fbf9a 46%, #2f8f86 58%, #1d6a6e 78%, #134a50 100%);
  font-family: var(--font); color: #fff; transition: opacity .6s ease, transform .6s ease; overflow: hidden;
}
#splash.done { opacity: 0; transform: scale(1.06); pointer-events: none; }
#splash i { position: absolute; display: block; pointer-events: none; }
/* the painted pond (bg_land / bg_port), blurred and darkened; the gradient shows only until it loads */
#splash .bg { position: absolute; inset: -24px; background: center / cover no-repeat; filter: blur(6px) brightness(.75) saturate(1.05); transform: scale(1.02); }
#splash::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, #0b2a1a00 40%, #0b2a1a88 100%); }
/* fireflies: warm glowing dots wandering and blinking */
.fly { width: 1.1vmin; height: 1.1vmin; border-radius: 50%; background: #fff6b0; box-shadow: 0 0 1.2vmin .5vmin #ffe46a, 0 0 3vmin 1vmin #ffd23a66;
  animation: wander 9s ease-in-out infinite, blink 1.7s ease-in-out infinite; }
.f1 { left: 14%; top: 34%; } .f2 { left: 30%; top: 12%; animation-delay: -2s, -.4s; } .f3 { left: 70%; top: 20%; animation-delay: -4s, -.9s; }
.f4 { left: 86%; top: 46%; animation-delay: -6s, -1.2s; } .f5 { left: 54%; top: 70%; animation-delay: -1s, -.2s; } .f6 { left: 8%; top: 62%; animation-delay: -3s, -1.4s; }
.f7 { left: 62%; top: 8%; animation-delay: -7s, -.6s; }
@keyframes wander { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(4vmin, -3vmin); } 50% { transform: translate(-2vmin, -6vmin); } 75% { transform: translate(-5vmin, -1vmin); } }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
/* pollen motes drifting slowly up around the logo (D16) */
.mote { width: .9vmin; height: .9vmin; border-radius: 50%; background: radial-gradient(circle, #fffdf0 0%, #fff8dccc 45%, #fff8dc00 72%); z-index: 1;
  opacity: 0; animation: moteUp 7s linear infinite; }
.m1 { left: 28%; top: 50%; } .m2 { left: 40%; top: 58%; animation-delay: -1.2s; animation-duration: 8s; } .m3 { left: 60%; top: 54%; animation-delay: -2.5s; }
.m4 { left: 72%; top: 46%; animation-delay: -3.6s; animation-duration: 9s; } .m5 { left: 35%; top: 36%; animation-delay: -4.8s; width: 1.3vmin; height: 1.3vmin; }
.m6 { left: 66%; top: 32%; animation-delay: -5.9s; animation-duration: 8.5s; width: 1.2vmin; height: 1.2vmin; }
@keyframes moteUp { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .75; } 50% { transform: translate(2.5vmin, -9vmin); } 85% { opacity: .6; } 100% { transform: translate(-1.5vmin, -18vmin); opacity: 0; } }
/* logo: the art image when present, else a chunky text logo */
#splash .logo { position: relative; z-index: 2; width: min(84vw, 64vh); display: flex; justify-content: center; animation: logobob 3.2s ease-in-out infinite; }
@keyframes logobob { 50% { transform: translateY(-1.6vh) rotate(-.6deg); } }
#splashLogoImg { display: none; width: 100%; height: auto; filter: drop-shadow(0 1.2vmin 0 #0b2a1a55) drop-shadow(0 0 2vmin #ffffff55); }
#splashLogoImg.on { display: block; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.tlogo { display: flex; flex-direction: column; align-items: center; line-height: .9; font-weight: 900; letter-spacing: .02em; text-align: center; }
.tlogo.off { display: none; }
.tlogo span { position: relative; display: block; }
.tlogo b, .tlogo em { display: block; font-style: normal; font-weight: 900; }
/* back layer: thick dark outline + drop shadow; front layer: the gradient fill */
.tlogo b { position: absolute; left: 0; top: 0; right: 0; color: var(--ol); -webkit-text-stroke: var(--sw) var(--ol); filter: drop-shadow(0 .9vmin 0 var(--ol)) drop-shadow(0 1.6vmin 1.2vmin #0b2a1a88); }
.tlogo em { position: relative; background: var(--fill); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.tlogo .w1 { --ol: #1d3a12; --sw: 2.2vmin; --fill: linear-gradient(180deg, #e8ffb0 0%, #a6f05a 40%, #4fbf2a 75%, #2f8a1e 100%); font-size: min(15vw, 12.5vh); transform: rotate(-3deg); }
.tlogo .w2 { --ol: #5a2e08; --sw: 1.8vmin; --fill: linear-gradient(180deg, #fffbd0 0%, #ffe24a 45%, #f2a812 80%, #c9780a 100%); font-size: min(11vw, 9vh); margin-top: .2vh; transform: rotate(2deg); }
/* loading bar: a wooden plank track, a lily-green fill with a glowing firefly at its head */
#splash .load { position: relative; z-index: 2; width: min(72vw, 56vh); text-align: center; }
#splash .track { height: 2.6vh; min-height: 16px; padding: .6vh; border-radius: 99px;
  background: linear-gradient(180deg, #a0682e, #7a4a20); border: .5vh solid #4a2a10;
  box-shadow: inset 0 .4vh 0 #c98a48, 0 .6vh 0 #2a170866, 0 0 0 .3vh #f5d58a55; }
#bar { position: relative; height: 100%; width: 0; min-width: max(2.6vh, 16px); border-radius: 99px;
  background: linear-gradient(180deg, #d4ff8a 0%, #8ee05a 40%, #4aa832 100%); box-shadow: inset 0 -.3vh 0 #2f7a24; }
/* the glow sits inside the fill's rounded tip (same height as the fill), so it never detaches from the end */
#bar .head { position: absolute; right: 8%; right: clamp(1px, .25vh, 4px); top: 12%; height: 76%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, #fffbe0 0%, #fff6b0 45%, #ffe46a 100%);
  box-shadow: 0 0 1vh .3vh #ffe46a, 0 0 2.4vh .6vh #ffd23a77; animation: blink 0.9s ease-in-out infinite; }
#splashMsg { margin-top: 1.8vh; font-size: max(14px, 2.4vh); font-weight: 800; letter-spacing: .04em; color: #fff;
  text-shadow: 0 .25vh 0 #134a50, 0 0 1vh #0b2a1a; }
#splashMsg.in { animation: msgIn .35s ease-out; }
#splashMsg.bad { color: #ffd25a; }
@keyframes msgIn { from { opacity: 0; transform: translateY(.8vh); } }
@media (prefers-reduced-motion: reduce) { #splash *, #splash *::before, #splash *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; } }
/* the stop panel (ticket check failed / unexpected error) */
#err { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: #0b1f14dd;
  font-family: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; }
#err.on { display: flex; }
#err .box { max-width: min(560px, 88vw); padding: 22px 26px; border: 4px solid #c99a4a; border-radius: 18px; background: #1d3a22; color: #f4f8e8;
  box-shadow: 0 10px 40px #000b, inset 0 0 0 3px #4a2a10; }
#err h2 { margin: 0 0 10px; color: #ff7f9a; letter-spacing: .08em; font-weight: 900; text-shadow: 0 2px 0 #3a0a18; }
#err .msg { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
#err .detail { font: 11px monospace; color: #b8ccb0; white-space: pre-wrap; max-height: 30vh; overflow: auto; }
#err button { font: 900 15px "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; padding: 9px 22px; background: #6cc04a; color: #fff;
  border: 3px solid #2f6a1e; border-radius: 99px; cursor: pointer; text-shadow: 0 2px 0 #2f6a1e; letter-spacing: .06em; }

</style>

  <script>
  // Splash: 5 s (TM splash) on a time-matched bar from page start; a load slower than that holds the bar at 97 %
  // until Splash.done(). The logo image (art key `logo`) replaces the text logo as soon as the art has it.
  window.Splash = (function () {
    var el = document.getElementById('splash'), bar = document.getElementById('bar'), msg = document.getElementById('splashMsg');
    var img = document.getElementById('splashLogoImg'), txt = document.getElementById('splashLogoText');
    var MSGS = ['Loading the pond...', 'Waking up the frog...', 'Counting the fireflies...', 'Polishing the lily pads...', 'Shooing the bugs in...', 'Warming up the tongue...'];
    var pct = 0, load = 0, loaded = false, over = false, mi = 0, logoTries = 0, resolveDone = null, donePromise = null;
    var dur = function () { return (window.TM && TM.s ? TM.s('splash') : 5) * 1000; };
    var testBoot = /(^#|&)test(&|$)/.test(location.hash);
    function tick() {
      if (over) return;
      // FF_DL: the share of the page downloaded (the Pages loader): the bar never runs ahead of the download
      var k = performance.now() / dur(); if (window.FF_DL != null) k = Math.min(k, 0.1 + 0.87 * window.FF_DL); if (!loaded) k = Math.min(k, 0.97);
      pct = Math.max(pct, Math.min(1, k)); bar.style.width = (pct * 100).toFixed(2) + '%';
      requestAnimationFrame(tick);
    }
    function rotate() { if (over) return; mi = (mi + 1) % MSGS.length; msg.classList.remove('in'); void msg.offsetWidth; msg.textContent = MSGS[mi]; msg.classList.add('in'); setTimeout(rotate, 1250); }
    function useLogo(src) { if (!src || img.dataset.on) return; img.onload = function () { img.dataset.on = '1'; img.classList.add('on'); txt.classList.add('off'); }; img.src = src; }
    function findLogo() {
      if (over || img.dataset.on) return;
      try {
        if (window.FF_SPLASH && window.FF_SPLASH.logo) return useLogo(window.FF_SPLASH.logo);
        if (window.FF_ART && window.FF_ART.logo) return useLogo(window.FF_ART.logo);
        var t = window.Art && Art.tex && Art.tex('logo'), s = t && t.baseTexture && t.baseTexture.resource && t.baseTexture.resource.source;
        if (s) { if (s.src) return useLogo(s.src); if (s.toDataURL) return useLogo(s.toDataURL()); }
      } catch (e) {}
      if (++logoTries < 60) setTimeout(findLogo, 150);
    }
    // the painted pond, blurred and darkened behind the logo: small previews inlined at the top of the built page
    // (FF_SPLASH, so they show from the first frame, not after the 12 MB page is parsed), the dev page beside it
    function useBg() {
      var key = innerHeight > innerWidth ? 'bg_port' : 'bg_land', src = window.FF_SPLASH ? window.FF_SPLASH[key] : 'splash/' + key + '.webp';
      if (src) document.getElementById('splashBg').style.backgroundImage = 'url("' + src + '")';
    }
    useBg();
    if (!window.FF_SPLASH) useLogo('splash/logo.webp');
    // the QA and TIMING buttons are always shown (client demo keeps the QA tools); ?qa=1 / #qa only adds error detail
    document.getElementById('errReload').onclick = function () { location.reload(); };
    tick(); setTimeout(rotate, 1250); findLogo();
    return {
      get over() { return over; },
      get pct() { return pct; },
      halt: function () { over = true; }, // the Pages loader hands the page over: this splash stops ticking
      // p: 0..1 (or 0..100); the bar follows the clock, the load only says "not yet"
      progress: function (p) { load = Math.max(load, p > 1 ? p / 100 : p); if (load >= 1) loaded = true; },
      message: function (text) { msg.textContent = text; },
      fail: function (text) { over = true; msg.textContent = text || 'NO CONNECTION - RELOAD TO TRY AGAIN'; msg.classList.add('bad'); },
      // the load is finished: the splash leaves on its own timeline; resolves when it starts to fade
      done: function () {
        if (donePromise) return donePromise;
        loaded = true; findLogo();
        donePromise = new Promise(function (res) { resolveDone = res; });
        var left = testBoot ? 0 : Math.max(200, dur() - performance.now());
        setTimeout(function () {
          over = true; pct = 1; bar.style.width = '100%';
          el.classList.add('done');
          setTimeout(function () { el.style.display = 'none'; }, 700);
          resolveDone();
        }, left);
        return donePromise;
      },
    };
  })();
  </script>
<script>
(function () {
  // fetch the game page with a live byte count, then hand the window over to it (document.write keeps the clock)
  var total = 13073582, url = 'game.html?v=ac6e4c112d';
  window.FF_DL = 0;
  function run(html) { window.FF_DL = 1; if (window.Splash && Splash.halt) Splash.halt(); document.open(); document.write(html); document.close(); }
  fetch(url).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (!r.body || !window.TextDecoder) return r.text();
    var rd = r.body.getReader(), dec = new TextDecoder(), parts = [], got = 0;
    function pump() {
      return rd.read().then(function (x) {
        if (x.done) { parts.push(dec.decode()); return parts.join(''); }
        got += x.value.length; window.FF_DL = Math.min(1, got / total); parts.push(dec.decode(x.value, { stream: true }));
        return pump();
      });
    }
    return pump();
  }).then(run, function () { location.replace(url); });
})();
</script>
